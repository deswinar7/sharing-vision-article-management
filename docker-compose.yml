services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: article
      MYSQL_USER: article_user
      MYSQL_PASSWORD: article_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

